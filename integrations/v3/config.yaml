# Single source of run configuration for the v3 VLN stack.
#
# Precedence, lowest to highest: this file -> environment variables already
# exported by the caller -> CLI flags. run_habitat.py loads it automatically;
# integrations/v3/run_config.py is the parser (``--manifest`` shows the
# resolved result, ``--shell`` feeds the launcher, ``--serve NAME`` feeds
# serve_vllm.sh / start_joyai_captioner.sh).
#
# Model services on GPUs 0-3, Habitat rollout workers on GPUs 4-7.

services:
  joyai:                                   # task-blind observer (Captioner)
    kind: joyai                            # served by FreeAskAgent/scripts/start_joyai_captioner.sh
    served_name: jdopensource/JoyAI-VL-Interaction
    base_url: http://127.0.0.1:7060/v1
    serve:
      model_dir: /data/pengyh/workspace/FreeAskAgent/models/JoyAI-VL-Interaction
      gpu: "0,1"
      tp: 2
      port: 7060
      gpu_util: 0.28
      max_model_len: 16384
      max_num_seqs: 4                      # one endpoint serves at most four ranks
      max_images: 14
  qwen3-vl-8b:                             # decision + completion gate + planner + actor + SoM
    served_name: qwen3-vl-8b
    base_url: http://127.0.0.1:8302/v1
    # Several replicas: use ``base_urls: [..]``; rank r talks to base_urls[r % n].
    serve:                                 # -> integrations/v3/serve_vllm.sh (SERVICE=qwen3-vl-8b)
      model_dir: /data/pengyh/workspace/FreeAskAgent/models/Qwen3-VL-8B-Instruct
      gpu: 2
      port: 8302
      gpu_util: 0.30
      max_model_len: 8192
      # v19 served 4 sequences for decision+gate+planner alone. The actor and
      # set-of-mark calls now land on the same endpoint (one more call per
      # step, sequential within a rank), so allow eight in flight.
      max_num_seqs: 8
      max_images: 16
  qwen3-vl-4b:                             # kept for A/B; no role uses it now
    served_name: qwen3-vl-4b
    base_url: http://127.0.0.1:8300/v1
    serve:
      model_dir: /data/pengyh/workspace/FreeAskAgent/models/Qwen3-VL-4B-Instruct
      gpu: 3
      port: 8300
      gpu_util: 0.30
      max_model_len: 8192
      max_num_seqs: 4
      max_images: 16

# Which service each model role calls. A role may also be an inline mapping
# ({service: qwen3-vl-8b, served_name: som-v1} for a LoRA adapter served with
# --lora-modules). planner defaults to decision, som defaults to actor.
models:
  observer: joyai                          # -> JOYAI_API_BASE
  decision: qwen3-vl-8b                    # -> CAPTIONER_DECISION_MODEL/_BASE_URL (also the isolated completion gate)
  planner: qwen3-vl-8b                     # -> VLN_PLANNER_MODEL/_BASE_URL
  actor: qwen3-vl-8b                       # -> --model-path vllm-<served_name> / --base-url / VLLM_BASE_URL
  som: qwen3-vl-8b                         # -> VLN_SOM_MODEL/_BASE_URL (omitted when same as actor)

captioner:                                 # TemporalMemory / Captioner switches
  # The Captioner always runs as JoyAI observer + separate decision model.
  inference_only_completion: true          # -> CAPTIONER_INFERENCE_ONLY_COMPLETION (isolated 2nd call before a stage advances)
  completion_screen: false                 # -> CAPTIONER_COMPLETION_SCREEN (screen final proposals on the current frame before the arrival ring; 200-set v5: previews 6% of steps but SR -8, keep off)
  preview_candidates: true                 # -> CAPTIONER_PREVIEW_CANDIDATES
  opening_look_around: true                # -> CAPTIONER_OPENING_LOOK_AROUND (step 0 renders the full preview ring)
  # Preview gating (2026-09-20): a repeated question is not re-asked until the
  # robot moved / turned; model route questions are limited to N idle attempts
  # per subgoal with a doubling retry cool-down (gate arrival rings exempt).
  preview_min_move_m: 1.0                  # -> CAPTIONER_PREVIEW_MIN_MOVE_M (doubles after each ring that settles nothing)
  preview_move_backoff_max_m: 8.0          # -> CAPTIONER_PREVIEW_MOVE_BACKOFF_MAX_M
  preview_gate_min_move_m: 0.5             # -> CAPTIONER_PREVIEW_GATE_MIN_MOVE_M (arrival rings of the completion gate)
  preview_gate_max_skips: 2                # -> CAPTIONER_PREVIEW_GATE_MAX_SKIPS (never skip more arrival rings in a row)
  preview_gate_free_rings: 6               # -> CAPTIONER_PREVIEW_GATE_FREE_RINGS (dense arrival rings per stage before the spacing backs off)
  preview_gate_backoff_start_m: 1.0        # -> CAPTIONER_PREVIEW_GATE_BACKOFF_START_M (then 1, 2, 4 m between arrival rings ...)
  preview_gate_backoff_max_m: 4.0          # -> CAPTIONER_PREVIEW_GATE_BACKOFF_MAX_M
  preview_idle_reset_m: 3.0                # -> CAPTIONER_PREVIEW_IDLE_RESET_M (moving this far re-allows route Previews)
  preview_min_turn_deg: 60                 # -> CAPTIONER_PREVIEW_MIN_TURN_DEG
  preview_idle_limit: 4                    # -> CAPTIONER_PREVIEW_IDLE_LIMIT (0 = never ignore)
  preview_backoff_max_steps: 16            # -> CAPTIONER_PREVIEW_BACKOFF_MAX_STEPS
  step_deadline_s: 30                      # -> CAPTIONER_STEP_DEADLINE_S
  # evidence_dir: /path                    # -> JOYAI_EVIDENCE_DIR (archive request images)

agent:
  som: true                                # -> VLN_SOM (set-of-mark candidate selection on the occupancy map)
  compact_subgoals: false                  # -> VLN_COMPACT_SUBGOALS
  structured_vlm_max_tokens: 192           # -> VLN_STRUCTURED_VLM_MAX_TOKENS
  vlm_image_max_pixels: 200704             # -> VLN_IMAGE_MAX_PIXELS (448*448)
  # frozen_plan_file: /path.json           # -> VLN_FROZEN_PLAN_FILE (replay a fixed subgoal plan)

# Sensor geometry (camera height / pitch / FOV / resolution, depth range) is
# hardware and lives in sensor_config.yaml (path relative to this file; the
# file beside config.yaml is the default). Old ``runner.camera_pitch_deg`` /
# ``runner.depth_hfov`` keys are still accepted and win over it.
sensors: sensor_config.yaml

robot:                                     # motion primitives -> Habitat + VLN_ROBOT_PARAMS
  forward_step_m: 0.25                     # one FORWARD primitive; the agent's collision test scales with it
  turn_angle_deg: 15                       # one LEFT/RIGHT primitive; must divide the actor's 45 deg turn request

spatial_memory:                            # occupancy grid + route geometry -> VLN_SPATIAL_MEMORY_PARAMS
  resolution_m: 0.10                       # cell size
  extent_m: 60.0                           # map side length, centred on the first pose
  max_range_m: 5.0                         # depth farther than this is not fused (floor or obstacle)
  min_range_m: 0.25
  floor_tolerance_m: 0.30                  # |height above floor| <= this counts as floor (when no floor mask)
  obstacle_band_m: [0.30, 1.80]            # height band above the floor that marks OCCUPIED
  pixel_stride: 3                          # depth subsampling for fusion
  inflate_m: 0.25                          # obstacle inflation for A* and connectivity (wide pass)
  route_inflate_m: [0.25, 0.15]            # inflations tried in order before a target is declared unreachable (0.15 = agent radius, keeps doorways open)
  unknown_cost: 2.5                        # A* cost multiplier of UNKNOWN cells
  clearance_m: 0.35                        # committed targets are snapped this far from OCCUPIED
  snap_radius_m: 1.0                       # search radius for that snap
  max_snap_m: 2.0                          # farthest a target may move to reachable floor
  mark_radius_m: 0.15                      # disc radius of a collision mark
  lookahead_m: 1.5                         # waypoint handed to the navmesh follower
  deploy_lookahead_m: 0.5                  # waypoint handed to the turn-then-forward follower (no navmesh)
  blind_zone_m: 1.0                        # floor the pitched camera cannot see; trusted straight ahead only
  fov_half_deg: 40.0                       # unobserved floor inside this cone is walked, outside it is looked at first

navigation:                                # agent constants -> VLN_NAV_PARAMS (protocol.py, lower-case names)
  step_budget_s: 10.0                      # wall budget of one act(); the launcher's VLN_STEP_BUDGET_S export wins
  max_floor_offset_m: 0.3                  # actor floor plane: pixels within this height of the floor are walkable
  # collision recovery (deployment mode)
  collision_translation_m: 0.05            # forward primitive advancing less than this along its heading = collision
  collision_recovery_turns: 3              # 15 deg primitives per recovery when the map has no opinion
  collision_repeat_window_steps: 12        # a collision within this many steps ...
  collision_repeat_radius_m: 1.0           # ... and this close to the last one is the same wall: turn further
  collision_max_recovery_turns: 12
  # approach before STOP
  final_approach_stop_m: 1.5               # stop when the confirmed endpoint is this close
  final_approach_max_steps: 16
  final_approach_nudge_steps: 3            # forward steps when the endpoint is confirmed in view but not located
  # targets
  spatial_target_max_age_steps: 12
  spatial_target_stagnation_steps: 6
  spatial_target_min_commit_m: 0.6
  spatial_lookahead_m: 1.5                 # (same role as spatial_memory.lookahead_m; the agent passes it as the default)
  committed_target_reached_m: 0.5
  som_max_candidates: 5
  som_target_max_age_steps: 24
  som_max_target_distance_m: 3.0
  preview_max_candidate_distance_m: 6.0
  # motion-loop / stall detection
  stall_evidence_frames: 4
  stall_translation_limit_m: 0.2
  turn_evidence_deg: 5.0
  locked_target_turn_tolerance_deg: 20.0
  recovery_lateral_distance_m: 1.5
  stage_path_overrun_m: 10.0
  behavior_history_size: 8
  # turn stages
  turn_alignment_deg: 60.0
  turn_around_min_progress_deg: 175.0
  turn_abandon_deg: 180.0
  subgoal_generation_attempts: 3

runner:                                    # run_habitat.py argparse defaults
  max_steps: 500
  waypoint_radius: 0.25
  actor: waypoint                          # waypoint | awarevln (serve_awarevln.py) | panohop (CWP look-around hops)
  record_video: false
  # Habitat navmesh on/off (CLI: --navmesh / --no-navmesh).
  #   true : agent gets a 6 m navmesh traversability window, waypoints run
  #          through Habitat's ShortestPathFollower (40-set SR 0.200, 2026-09-10)
  #   false: deployment mode, nothing a real robot lacks - agent answers
  #          navigability from its own occupancy grid, waypoints run through a
  #          turn-then-forward follower (40-set SR 0.050, 2026-09-11; the
  #          follower still lacks collision recovery, see memory notes)
  navmesh: false
  # Headings (deg, right positive) rendered for every surrounding-view request.
  # The model never picks a direction. Each view is 90 deg wide: the front five
  # overlap by half, 180 closes the rear gap (6 views, a full ring).
  preview_yaws: [0, -45, 45, -90, 90, 180]
  preview_scale: 0.5                       # views are downscaled before crossing the pipe
  # panohop_mode: always                   # always | selective

eval:                                      # consumed by the launcher scripts
  split: val_unseen
  episodes: 0                              # 0 = every episode of the split (unless episode_set is given)
  # episode_set: integrations/v3/eval_sets/val_unseen_200.txt   # the 200-episode set is the decision standard
  rank_gpus: [4, 5, 6, 7]                  # one Habitat worker per entry; length = world size
